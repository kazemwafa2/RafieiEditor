plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rafiei.editor'
    compileSdk 34

    defaultConfig {
        applicationId "com.rafiei.editor"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    def ksFile = rootProject.file("rafiei.jks")
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword "rafiei123"
                keyAlias "rafiei"
                keyPassword "rafiei123"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    def media3 = "1.4.1"
    implementation "androidx.media3:media3-common:$media3"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-transformer:$media3"
    implementation "androidx.media3:media3-effect:$media3"
    implementation "com.google.guava:guava:33.2.1-android"
}
