name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK and save full log
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain --info 2>&1 | tee build.log

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RafieiEditor-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RafieiEditor-apk
          path: app/build/outputs/apk/debug/*.apk
