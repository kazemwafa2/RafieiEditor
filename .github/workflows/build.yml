name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            grep -n -B 3 -A 5 -E 'e: file:|What went wrong:|Unresolved reference|Expecting|Compilation error|error:' build.log || true
            tail -n 40 build.log
          fi
          exit "$result"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RafieiEditor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
