name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create signing key if it is missing
        run: |
          if [ ! -f rafiei.jks ]; then
            keytool -genkeypair -v -keystore rafiei.jks -storepass rafiei123 -keypass rafiei123 -alias rafiei -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Rafiei Editor, O=Rafiei, C=AF"
          fi
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RafieiEditor-apk
          path: app/build/outputs/apk/release/*.apk
